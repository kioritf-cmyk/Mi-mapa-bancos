<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa Interactivo – Bancos de Alta Gracia</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
h1 { text-align: center; }
.card {
    background: white; padding: 15px; margin: 15px 0; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
a { font-size: 16px; font-weight: bold; color: #0055aa; }
.small { font-size: 14px; color: #444; }
.map-container {
    width: 100%;
    height: 480px;
    margin-top: 20px;
    border: 2px solid #ccc;
}
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h1>Mapa Interactivo – Bancos de Alta Gracia</h1>
<p>Podés hacer zoom, mover el mapa y tocar cada marcador para ver los datos del banco.</p>

<div id="map" class="map-container"></div>

<script>
const bancos = [
  {
    nombre: "Bancor – Sucursal Alta Gracia",
    direccion: "Rafael Lozada y Belgrano",
    lat: -31.657791,
    lon: -64.432785
  },
  {
    nombre: "Banco Macro – Sucursal Alta Gracia",
    direccion: "Av. Belgrano 321",
    lat: -31.65760,
    lon: -64.43050
  },
  {
    nombre: "Banco Nación – Sucursal Alta Gracia",
    direccion: "Av. Belgrano 115",
    lat: -31.65747,
    lon: -64.43281
  },
  {
    nombre: "Banco Santander – Sucursal Alta Gracia",
    direccion: "Bv. Padre Grenon 207",
    lat: -31.655072,
    lon: -64.436415
  }
];

const map = L.map('map').setView([-31.6575, -64.4330], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

bancos.forEach(banco => {
  L.marker([banco.lat, banco.lon])
    .addTo(map)
    .bindPopup(`<b>${banco.nombre}</b><br>${banco.direccion}`);
});
</script>

</body>
</html>
